name: Suite de Pruebas Automatizadas Playwright

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_execution:
    name: Ejecución de Tests en Ubuntu Cloud
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar librerías del framework
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-playwright Faker pytest-html

    - name: Instalar Navegadores de Playwright
      run: playwright install chromium --with-deps

    # REPARACIÓN AQUÍ: Le decimos a pytest que ignore el archivo pytest.ini usando -c /dev/null
    - name: Ejecutar Suite de Tests con Pytest
      run: pytest -c /dev/null tests/

    - name: Guardar Reporte HTML como Evidencia
      if: always() # 💡 Esto es un truco maestro: rescata el reporte aunque algún test falle
      uses: actions/upload-artifact@v4
      with:
          name: reporte-automatizacion-alberto
          path: reporte.html  