name: Suite de Pruebas Automatizadas Playwright

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test_execution:
    name: Ejecución de Tests en Ubuntu Cloud
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar librerías del framework
      run: |
        python -m pip install --upgrade pip
        pip install playwright pytest pytest-html Faker pytest-base-url

    - name: Instalar Navegadores de Playwright
      run: playwright install chromium --with-deps

    # REPARACIÓN AQUÍ: Ejecutamos pytest normal y le inyectamos la variable de entorno para apagar la interfaz gráfica
    - name: Ejecutar Suite de Tests con Pytest
      run: pytest
      env:
        HEADLESS: true